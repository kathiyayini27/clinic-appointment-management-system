
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Book Appointment</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #dbeafe, #e0e7ff);
            min-height: 100vh;
        }

        .appointment-card {
            max-width: 650px;
            margin: 40px auto;
            border: none;
            border-radius: 18px;
        }

        .btn-book {
            background: #2563eb;
            color: white;
        }

        .btn-book:hover {
            background: #1d4ed8;
            color: white;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card appointment-card shadow-lg p-4">

        <h2 class="text-center text-primary fw-bold">
            🏥 Book Appointment
        </h2>

        <p class="text-center text-muted">
            Clinic Appointment Management System
        </p>

        <hr>

        {% if form.errors %}
        <div class="alert alert-danger">
            Please correct the errors below.
            {{ form.errors }}
        </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label fw-semibold">Patient</label>
                {{ form.patient }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Doctor</label>
                {{ form.doctor_name }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Appointment Date</label>
                {{ form.appointment_date }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Appointment Time</label>
                {{ form.appointment_time }}
            </div>

            <div class="mb-3">
                <label class="form-label fw-semibold">Reason</label>
                {{ form.reason }}
            </div>

            <button type="submit" class="btn btn-book w-100 mb-2">
                Book Appointment
            </button>

            <a href="{% url 'appointment_list' %}"
               class="btn btn-outline-secondary w-100">
                Cancel
            </a>

        </form>

    </div>

</div>

</body>
</html>
